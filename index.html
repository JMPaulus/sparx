  <style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

/* ============================================================
   Sparx — Color System · "Sparx Green"
   Forest green-black base, brand green for accents, lime as the
   pop color for big numbers on DARK sections only.
   Anchored to the v2.1 spec palette. AA-minded.
   ============================================================ */

:root {
  /* ---- Forest (dark base — deep green-black, from the logo) ---- */
  --forest:    #0C1A12;   /* dark section bg / strong text on light */
  --forest-2:  #14271C;   /* cards on dark */
  --forest-3:  #1C3527;   /* raised / hover on dark */

  /* ---- Cloud / white (light surfaces) ---- */
  --cloud:  #F3F7F3;      /* light section bg (greenish white) */
  --white:  #FFFFFF;      /* cards on light */

  /* ---- Graphite (neutral dark — third section background) ---- */
  --graphite:   #21262A;  /* neutral graphite section bg */
  --graphite-2: #2B3136;  /* cards on graphite */
  --graphite-3: #353C42;  /* raised / hover on graphite */

  /* ---- Green ramp (brand) ---- */
  --green-100: #E4F2E6;   /* tint fills, compliance badges */
  --green-300: #5CC76C;   /* = lime */
  --green:     #109B24;   /* brand: accents, icons, underlines */
  --green-cta: #0C7D1C;   /* CTA fill (white text, AA) + links on light */
  --green-cta-hover: #0A6817;
  --green-cta-press: #08570F;

  /* ---- Lime (POP — big numbers / accent on DARK only) ---- */
  --lime: #5CC76C;

  /* ---- Greens-gray text + lines ---- */
  --mist:       #5B6B60;             /* secondary text on light */
  --mist-dark:  #9DB0A2;             /* secondary text on dark */
  --text-light: #E7F0E9;             /* body text on dark */
  --line:       #E3EAE4;             /* borders on light */
  --line-dark:  rgba(255,255,255,0.10); /* borders on dark */
  --line-dark-strong: rgba(255,255,255,0.18);

  /* ---- Support / semantic states ---- */
  --positive: #0C7D1C;
  --warning:  #B9770A;
  --danger:   #C53B22;
  --danger-soft: #FBE7E2;

  /* ============================================================
     SEMANTIC ALIASES — prefer these in components & layouts
     ============================================================ */

  /* Surfaces */
  --bg-page: var(--cloud);
  --bg-ink: var(--forest);
  --bg-ink-deep: #081208;
  --bg-graphite: var(--graphite);          /* neutral dark section */
  --surface-card: var(--white);
  --surface-card-ink: var(--forest-2);
  --surface-card-graphite: var(--graphite-2);
  --surface-subtle: var(--green-100);

  /* Text on light */
  --text-strong: var(--forest);
  --text-body: #2B362F;
  --text-muted: var(--mist);
  --text-faint: #8A988E;

  /* Text on ink */
  --text-on-ink: var(--text-light);
  --text-on-ink-muted: var(--mist-dark);
  --text-on-ink-faint: #6E7F73;

  /* Action — single dominant CTA uses --accent-cta */
  --accent: var(--green);            /* accents, icons, underlines */
  --accent-cta: var(--green-cta);    /* primary CTA fill + links on light */
  --accent-cta-hover: var(--green-cta-hover);
  --accent-cta-press: var(--green-cta-press);
  --on-accent: var(--white);
  --accent-soft: var(--green-100);

  /* Stats */
  --stat-on-light: var(--green-cta);
  --stat-on-dark: var(--lime);

  /* Compliance / trust badge (RODO, ISO) */
  --trust-bg: rgba(12,125,28,0.12);
  --trust-fg: var(--green-cta);

  /* Borders */
  --border: var(--line);
  --border-strong: #CFDBD2;
  --border-ink: var(--line-dark);
  --border-ink-strong: var(--line-dark-strong);

  /* Focus ring */
  --ring: rgba(16,155,36,0.45);
}


/* ============================================================
   SPARX — Typography
   Inter system-wide — matches the live site (sparx.wtf uses
   Inter, system-ui, sans-serif). Headings differentiate by
   weight + tight tracking rather than a separate display face.
   Loaded via Google Fonts in fonts/fonts.css.
   ============================================================ */

:root {
  /* Families */
  --font-display: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

  /* Weights */
  --fw-regular: 400;   /* @kind other */
  --fw-medium: 500;    /* @kind other */
  --fw-semibold: 600;  /* @kind other */
  --fw-bold: 700;      /* @kind other */

  /* Type scale (spec v2.1 desktop steps) */
  --fs-display: 4.5rem;    /* 72px — hero on large screens */
  --fs-h1: 3.875rem;       /* 62px */
  --fs-h2: 2.5rem;         /* 40px */
  --fs-h3: 1.375rem;       /* 22px */
  --fs-h4: 1.25rem;        /* 20px */
  --fs-lead: 1.25rem;      /* 20px — intro paragraph */
  --fs-body: 1.0625rem;    /* 17px — default body */
  --fs-sm: 0.9375rem;      /* 15px */
  --fs-xs: 0.8125rem;      /* 13px */
  --fs-overline: 0.75rem;  /* 12px — eyebrow / label */
  --fs-stat: 5.5rem;       /* 88px — big counting stats (64–96) */

  /* Line heights */
  --lh-tight: 1.05;    /* @kind other */
  --lh-snug: 1.1;      /* @kind other */ /* headings (spec) */
  --lh-normal: 1.4;    /* @kind other */
  --lh-relaxed: 1.6;   /* @kind other */ /* body (spec) */

  /* Letter spacing */
  --ls-tight: -0.03em;   /* @kind other */
  --ls-snug: -0.015em;   /* @kind other */
  --ls-normal: 0;        /* @kind other */
  --ls-overline: 0.16em; /* @kind other */
}


/* ============================================================
   SPARX — Spacing (8px base rhythm) + layout widths
   ============================================================ */

:root {
  --space-0: 0;
  --space-1: 0.25rem;   /* 4 */
  --space-2: 0.5rem;    /* 8 */
  --space-3: 0.75rem;   /* 12 */
  --space-4: 1rem;      /* 16 */
  --space-5: 1.5rem;    /* 24 */
  --space-6: 2rem;      /* 32 */
  --space-7: 3rem;      /* 48 */
  --space-8: 4rem;      /* 64 */
  --space-9: 6rem;      /* 96 */
  --space-10: 8rem;     /* 128 */

  /* Section vertical rhythm */
  --section-y: clamp(4rem, 8vw, 8rem); /* @kind spacing */

  /* Layout */
  --container: 1200px;
  --container-narrow: 760px;
  --gutter: clamp(1.25rem, 5vw, 2.5rem); /* @kind spacing */

  /* Mobile sticky CTA bar height */
  --mobile-bar-h: 4.5rem;
}


/* ============================================================
   SPARX — Radius
   Calm, slightly-rounded. Pills only for buttons/badges.
   ============================================================ */

:root {
  --radius-xs: 4px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  --radius-pill: 999px;
}


/* ============================================================
   Sparx — Shadows & elevation
   Soft, low, cool-green-tinted. NO neon glows (spec: "bez
   neonowych poświat"). Dark sections lean on borders + dot grid.
   ============================================================ */

:root {
  /* Elevation on light surfaces — cards use sm/md */
  --shadow-xs: 0 1px 2px rgba(12, 26, 18, 0.05);
  --shadow-sm: 0 2px 8px rgba(12, 26, 18, 0.06);
  --shadow-md: 0 10px 28px -10px rgba(12, 26, 18, 0.14);
  --shadow-lg: 0 24px 56px -16px rgba(12, 26, 18, 0.20);

  /* CTA — a soft lift only, no glow */
  --shadow-cta: 0 8px 20px -8px rgba(12, 125, 28, 0.40);
}


/* ============================================================
   SPARX — Motion
   Restrained, confident. Short eases on interaction; slightly
   longer, soft eases for entrances. No bounce, no hype.
   ============================================================ */

:root {
  --ease-standard: cubic-bezier(0.22, 0.61, 0.36, 1); /* @kind other */
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);          /* @kind other */
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);      /* @kind other */

  --dur-fast: 120ms;     /* @kind other */
  --dur-base: 200ms;     /* @kind other */
  --dur-slow: 420ms;     /* @kind other */
  --dur-entrance: 640ms; /* @kind other */
  --dur-count: 1600ms;   /* @kind other */
}


/* ============================================================
   SPARX — Base / reset
   Element defaults that apply the tokens. Kept minimal.
   ============================================================ */

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  font-family: var(--font-body);
  font-size: var(--fs-body);
  line-height: var(--lh-relaxed);
  color: var(--text-body);
  background: var(--bg-page);
  font-feature-settings: "cv05" 1, "ss01" 1;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

h1, h2, h3, h4 {
  font-family: var(--font-display);
  color: var(--text-strong);
  font-weight: var(--fw-bold);
  line-height: var(--lh-snug);
  letter-spacing: var(--ls-snug);
  margin: 0;
}

p { margin: 0; }

a { color: inherit; text-decoration: none; }

button { font-family: inherit; }

/* Eyebrow / overline helper */
.sx-overline {
  font-family: var(--font-body);
  font-size: var(--fs-overline);
  font-weight: var(--fw-semibold);
  letter-spacing: var(--ls-overline);
  text-transform: uppercase;
  color: var(--accent);
}

/* Focus visibility */
:where(a, button, input, textarea, select):focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--radius-xs);
}

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}


/* ============================================================
   Sparx landing UI kit — layout & section scaffolding.
   Uses DS tokens; composes DS components for all primitives.
   ============================================================ */

.kit { font-family: var(--font-body); color: var(--text-body); background: var(--bg-page); overflow-x: clip; }

/* ---- Containers & sections ---- */
.kit-section { padding-block: var(--section-y); position: relative; }
.kit-container { max-width: var(--container); margin: 0 auto; padding-inline: var(--gutter); }
.kit-narrow { max-width: var(--container-narrow); }

.kit-section--cloud { background: var(--cloud); color: var(--text-body); }
.kit-section--forest { background: var(--forest); color: var(--text-on-ink); }
.kit-section--graphite { background: var(--graphite); color: var(--text-on-ink); }
.kit-section--cta { background: var(--green-cta); color: #fff; }

/* dotted texture for dark sections */
.kit-section--forest::before,
.kit-section--graphite::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background-image: radial-gradient(rgba(92,199,108,0.10) 1px, transparent 1px);
  background-size: 26px 26px; opacity: 0.6;
  -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent 70%);
  mask-image: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent 70%);
}
.kit-section > .kit-container { position: relative; z-index: 1; }

/* ---- Type helpers ---- */
.kit-eyebrow { font-size: var(--fs-overline); font-weight: var(--fw-semibold); letter-spacing: var(--ls-overline);
  text-transform: uppercase; color: var(--green); margin-bottom: var(--space-4); }
.kit-section--forest .kit-eyebrow, .kit-section--graphite .kit-eyebrow { color: var(--lime); }
.kit-section--cta .kit-eyebrow { color: rgba(255,255,255,0.82); }
.kit-h1 { font-family: var(--font-display); font-weight: var(--fw-bold); font-size: clamp(2.5rem, 6vw, var(--fs-h1));
  line-height: var(--lh-snug); letter-spacing: var(--ls-tight); color: var(--text-strong); margin: 0; }
.kit-section--forest .kit-h1, .kit-section--graphite .kit-h1, .kit-section--cta .kit-h1 { color: #fff; }
.kit-h2 { font-family: var(--font-display); font-weight: var(--fw-bold); font-size: clamp(2rem, 4vw, var(--fs-h2));
  line-height: var(--lh-snug); letter-spacing: var(--ls-snug); color: var(--text-strong); margin: 0;
  text-wrap: balance; }
.kit-section--forest .kit-h2, .kit-section--graphite .kit-h2, .kit-section--cta .kit-h2 { color: #fff; }
.kit-lead { font-size: var(--fs-lead); line-height: 1.55; color: var(--text-body); max-width: 52ch; margin: 0; }
.kit-section--forest .kit-lead, .kit-section--graphite .kit-lead { color: var(--text-on-ink-muted); }
.kit-section--cta .kit-lead { color: rgba(255,255,255,0.92); }
.kit-accent { color: var(--lime); }
.kit-prose { font-size: var(--fs-body); line-height: 1.6; }

.kit-head { max-width: 56ch; margin-bottom: var(--space-7); }
.kit-head--center { margin-inline: auto; text-align: center; }

/* ---- Grids ---- */
.kit-grid { display: grid; gap: var(--space-5); }
.kit-grid-3 { grid-template-columns: repeat(3, 1fr); }
.kit-grid-2 { grid-template-columns: repeat(2, 1fr); }

/* ---- Reveal on scroll (must never trap content hidden) ---- */
.reveal { opacity: 1; transform: none; }
.reveal.armed { opacity: 0; transform: translateY(18px);
  transition: opacity var(--dur-entrance) var(--ease-out), transform var(--dur-entrance) var(--ease-out); }
.reveal.armed.in { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) { .reveal, .reveal.armed { opacity: 1; transform: none; transition: none; } }

@media (max-width: 880px) {
  .kit-grid-3, .kit-grid-2 { grid-template-columns: 1fr; }
}

/* ============================== NAV ============================== */
.kit-nav { position: sticky; top: 0; z-index: 50; background: rgba(12,26,18,0.86);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border-ink); }
.kit-nav__inner { max-width: var(--container); margin: 0 auto; padding: 0 var(--gutter);
  height: 72px; display: flex; align-items: center; gap: var(--space-6); }
.kit-nav__logo { height: 34px; display: block; }
.kit-nav__links { display: flex; gap: var(--space-6); margin-left: auto; }
.kit-nav__link { font-size: var(--fs-sm); font-weight: var(--fw-medium); color: var(--text-on-ink-muted);
  transition: color var(--dur-base) var(--ease-standard); text-decoration: none; }
.kit-nav__link:hover { color: #fff; }
.kit-nav__right { display: flex; align-items: center; gap: var(--space-4); }
.kit-nav__burger { display: none; margin-left: auto; }

/* mobile menu overlay */
.kit-menu { position: fixed; inset: 0; z-index: 60; background: var(--forest);
  display: flex; flex-direction: column; padding: var(--gutter); overflow-y: auto;
  visibility: hidden; transform: translateY(-100%);
  transition: transform var(--dur-slow) var(--ease-out), visibility 0s linear var(--dur-slow); }
.kit-menu.open { transform: translateY(0); visibility: visible; transition: transform var(--dur-slow) var(--ease-out); }
.kit-menu__top { display: flex; align-items: center; justify-content: space-between; height: 40px; }
.kit-menu__links { display: flex; flex-direction: column; gap: var(--space-5); margin-top: var(--space-8); }
.kit-menu__link { font-family: var(--font-display); font-weight: var(--fw-semibold); font-size: 2rem; color: #fff;
  text-decoration: none; }
.kit-menu__foot { margin-top: auto; display: flex; flex-direction: column; gap: var(--space-4); padding-top: var(--space-7); }

/* ============================== HERO ============================== */
.kit-hero { padding-top: clamp(3rem, 7vw, 6rem); padding-bottom: clamp(4rem, 8vw, 7rem); }
.kit-hero__grid { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: var(--space-8); align-items: center; }
.kit-hero__cta-row { display: flex; flex-wrap: wrap; gap: var(--space-4); margin-top: var(--space-7); }
.kit-hero__proof { margin-top: var(--space-7); font-size: var(--fs-sm); color: var(--text-on-ink-muted);
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-top: var(--space-5);
  border-top: 1px solid var(--border-ink); }
.kit-hero__proof b { color: var(--text-on-ink); font-weight: var(--fw-semibold); }
.kit-hero__peaks { width: 100%; max-width: 460px; margin-left: auto; display: block; }
.kit-hero__pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--lime); flex: none;
  box-shadow: 0 0 0 0 rgba(92,199,108,0.6); animation: kit-pulse 2.4s ease-out infinite; }
@keyframes kit-pulse { 0% { box-shadow: 0 0 0 0 rgba(92,199,108,0.5); } 70% { box-shadow: 0 0 0 9px rgba(92,199,108,0); } 100% { box-shadow: 0 0 0 0 rgba(92,199,108,0); } }
@media (prefers-reduced-motion: reduce) { .kit-hero__pulse { animation: none; } }

/* ============================ MOBILE BAR ========================== */
.kit-mobilebar { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 55;
  background: rgba(12,26,18,0.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--border-ink);
  padding: 10px var(--gutter) calc(10px + env(safe-area-inset-bottom));
  gap: 10px; }
.kit-mobilebar .grow { flex: 1; }

@media (max-width: 880px) {
  .kit-nav__links, .kit-nav__right { display: none; }
  .kit-nav__burger { display: inline-flex; }
  .kit-hero__grid { grid-template-columns: 1fr; gap: var(--space-6); }
  .kit-hero__peaks { display: none; }
  .kit-mobilebar { display: flex; }
  .kit { padding-bottom: var(--mobile-bar-h); }
}

/* ===================== PROBLEM ===================== */
.kit-stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-7); }
.kit-punch { font-family: var(--font-display); font-weight: var(--fw-semibold); font-size: var(--fs-h3);
  line-height: 1.35; color: var(--text-strong); max-width: 62ch; margin-top: var(--space-8); }
.kit-punch b { color: var(--green-cta); font-weight: var(--fw-bold); }
.kit-problem-lead { font-size: var(--fs-lead); line-height: 1.55; color: var(--text-muted);
  max-width: 60ch; margin-top: var(--space-4); }

@media (max-width: 880px) {
  .kit-stats3 { grid-template-columns: 1fr; gap: var(--space-7); }
}

/* ===================== SOLUTION ===================== */
.kit-sol-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-5); }
.kit-sol-card h3 { font-family: var(--font-display); font-weight: var(--fw-semibold); font-size: var(--fs-h3);
  color: var(--text-on-ink); margin: 0 0 var(--space-3); }
.kit-sol-card p { font-size: var(--fs-sm); line-height: 1.55; color: var(--text-on-ink-muted); margin: 0; }
.kit-badges { display: flex; gap: 8px; flex-wrap: wrap; margin-top: var(--space-4); }
.kit-contrast-wrap { margin-top: var(--space-7); }

@media (max-width: 880px) {
  .kit-sol-grid { grid-template-columns: 1fr; }
}

/* ===================== HOW ===================== */
.kit-steps { display: flex; align-items: stretch; gap: var(--space-3); }
.kit-steps__item { flex: 1 1 0; min-width: 0; }
.kit-steps__arrow { flex: none; align-self: flex-start; margin-top: 8px; color: var(--green); }
.kit-models { display: flex; gap: var(--space-3); flex-wrap: wrap; margin-top: var(--space-8); align-items: center; }
.kit-models__lbl { font-size: var(--fs-sm); font-weight: var(--fw-semibold); color: var(--text-muted); margin-right: var(--space-2); }
.kit-pill { border: 1px solid var(--border-strong); border-radius: var(--radius-pill); padding: 10px 18px;
  font-weight: var(--fw-semibold); font-size: var(--fs-sm); color: var(--text-strong); background: #fff; }
.kit-note { margin-top: var(--space-5); font-size: var(--fs-sm); color: var(--text-muted); max-width: 60ch; }

@media (max-width: 880px) {
  .kit-steps { flex-direction: column; }
  .kit-steps__arrow { transform: rotate(90deg); align-self: flex-start; margin: 2px 0 2px 18px; }
}

/* ===================== WORK ===================== */
.kit-overtitle { font-family: var(--font-display); font-weight: var(--fw-semibold); font-size: var(--fs-h3);
  color: var(--lime); margin-bottom: var(--space-7); }
.kit-work-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: var(--space-5); }
.kit-work-grid > * { grid-column: span 2; }
.kit-work-grid > *:nth-child(4) { grid-column: 2 / span 2; }
.kit-work-grid > *:nth-child(5) { grid-column: 4 / span 2; }
.kit-retail-band { margin-top: var(--space-7); display: flex; align-items: center; gap: var(--space-6);
  border: 1px solid var(--border-ink); border-radius: var(--radius-lg); padding: var(--space-6);
  background: rgba(255,255,255,0.03); }
.kit-retail-band__num { font-family: var(--font-display); font-weight: var(--fw-bold); line-height: 1;
  font-size: clamp(3rem, 6vw, 4.5rem); color: var(--lime); flex: none; }
.kit-retail-band__text { font-size: var(--fs-h4); color: var(--text-on-ink); max-width: 54ch; }
.kit-retail-band__src { font-size: var(--fs-xs); color: var(--text-on-ink-faint); margin-top: 8px; }

@media (max-width: 880px) {
  .kit-work-grid { grid-template-columns: 1fr; }
  .kit-work-grid > *, .kit-work-grid > *:nth-child(4), .kit-work-grid > *:nth-child(5) { grid-column: auto; }
  .kit-retail-band { flex-direction: column; align-items: flex-start; }
}

/* ===================== AUDIENCE ===================== */
.kit-audience { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-8); }

.kit-aud-col h3 { font-family: var(--font-display); font-weight: var(--fw-semibold); font-size: var(--fs-h2);
  color: var(--text-strong); margin: 0 0 var(--space-4); }

.kit-person { flex: 1; display: flex; flex-direction: column; gap: 10px; }
.kit-person__photo { width: 100%; aspect-ratio: 1 / 1; border-radius: var(--radius-md);

.kit-person__role { font-size: var(--fs-sm); font-weight: var(--fw-semibold); color: var(--text-on-ink); }
.kit-news__name { display: flex; align-items: center; gap: 10px; font-family: var(--font-display);

.kit-contact__grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-8); align-items: start; }
.kit-contact__head .kit-lead { color: rgba(255,255,255,0.92); margin-top: var(--space-4); }

.kit-channel { display: flex; align-items: center; gap: var(--space-4); padding: 14px 16px;

.kit-form__ok-mark svg { width: 28px; height: 28px; }
.kit-form__ok h3 { font-family: var(--font-display); font-size: var(--fs-h3); color: var(--text-strong); margin: 0; }
.kit-topics__label { font-size: var(--fs-sm); font-weight: var(--fw-semibold); color: var(--text-strong); margin-bottom: var(--space-2); }
.kit-topics__row { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.kit-topic-pill { border: 1px solid var(--border-strong); border-radius: var(--radius-pill); padding: 10px 18px;
  background: #fff; font: inherit; font-size: var(--fs-sm); font-weight: var(--fw-semibold); color: var(--text-strong);

  <script type="text/babel">
/* Sparx landing — App root: language state, cookie banner, assembly */
const { Button } = window.SPARXDesignSystem_59b6c5;
const { L } = window.SXKit;
const { Nav, Hero, MobileBar } = window.SX;
const { Problem, Solution, How } = window.SX;
const { Work, Audience, Partners } = window.SX;
const { Contact, Footer } = window.SX;

const COOKIE_KEY = "sparx-cookie";
const LANG_KEY   = "sparx-lang";

function CookieBanner({ lang }) {
  const [visible, setVisible] = React.useState(() => {
    try { return !localStorage.getItem(COOKIE_KEY); } catch { return true; }
  });
  const decide = (v) => {
    try { localStorage.setItem(COOKIE_KEY, v); } catch {}
    setVisible(false);
  };
  if (!visible) return null;
  return (
    <div className="kit-cookie" role="region" aria-label={L(lang, "Cookies", "Cookies")}>
      <p className="kit-cookie__text">
        {L(lang,
          <>Używamy plików cookie do analityki — ładujemy ją dopiero po Twojej zgodzie. <a href="#">Polityka prywatności</a>.</>,
          <>We use cookies for analytics — loaded only after you agree. <a href="#">Privacy policy</a>.</>)}
      </p>
      <div className="kit-cookie__btns">
        <Button variant="ghost" size="sm" onClick={() => decide("declined")}>
          {L(lang, "Tylko niezbędne", "Essential only")}
        </Button>
        <Button variant="primary" size="sm" onClick={() => decide("accepted")}>
          {L(lang, "Akceptuję", "Accept")}
        </Button>
      </div>
    </div>
  );
}

function App() {
  const [lang, setLang] = React.useState(() => {
    try { return localStorage.getItem(LANG_KEY) || "pl"; } catch { return "pl"; }
  });
  const update = (l) => {
    setLang(l);
    try { localStorage.setItem(LANG_KEY, l); } catch {}
    document.documentElement.lang = l;
  };
  React.useEffect(() => { document.documentElement.lang = lang; }, []);

  return (
    <div className="kit">
      <Nav lang={lang} setLang={update} />
      <main>
        <Hero lang={lang} />
        <Problem lang={lang} />
        <Solution lang={lang} />
        <How lang={lang} />
        <Work lang={lang} />
        <Audience lang={lang} />
        <Partners lang={lang} />
        <Contact lang={lang} />
      </main>
      <Footer lang={lang} />
      <MobileBar lang={lang} />
      <CookieBanner lang={lang} />
    </div>
  );
}

/* Re-use the root the bundle already created to avoid the createRoot() warning */
if (window.__sparxRoot) {
  window.__sparxRoot.render(React.createElement(App));
} else {
  window.__sparxRoot = ReactDOM.createRoot(document.getElementById("root"));
  window.__sparxRoot.render(React.createElement(App));
}

  </script>
