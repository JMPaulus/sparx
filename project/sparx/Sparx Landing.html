  <!-- Intercept createRoot: bundle calls it 3× — we reuse the first root to suppress React warning -->
  <!-- Also redirect bundle's baked-in asset paths (../assets/*.svg) to our local copies       -->
  <script>
    (function() {
      /* 1. Patch createRoot to reuse a single root */
      var origCR = ReactDOM.createRoot.bind(ReactDOM);
      ReactDOM.createRoot = function(container, opts) {
        if (window.__sparxRoot && container === document.getElementById('root')) {
          return window.__sparxRoot;
        }
        window.__sparxRoot = origCR(container, opts);
        return window.__sparxRoot;
      };

      /* 2. Redirect bundle's baked-in ../assets/ paths to our sparx/assets/ copies */
      var srcDesc = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src');
      if (srcDesc && srcDesc.set) {
        Object.defineProperty(HTMLImageElement.prototype, 'src', {
          configurable: true, enumerable: true,
          get: srcDesc.get,
          set: function(v) {
            if (typeof v === 'string') {
              if (v.indexOf('sparx-logo-ondark') !== -1) v = 'assets/sparx-logo-ondark.png';
              else if (v.indexOf('sparx-logo-onlight') !== -1) v = 'assets/sparx-logo-onlight.png';
              else if (v.indexOf('hero-peaks') !== -1) v = 'assets/hero-peaks.svg';
            }
            srcDesc.set.call(this, v);
          }
        });
      }
    })();
  </script>
