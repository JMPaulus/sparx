  <script>
    (function() {
      /* 1. Patch createRoot to reuse a single root */
      var origCR = ReactDOM.createRoot.bind(ReactDOM);
      ReactDOM.createRoot = function(container, opts) {
        if (window.__sparxRoot && container === document.getElementById('root')) {
          return window.__sparxRoot;
        }
        window.__sparxRoot = origCR(container, opts);
        return window.__sparxRoot;
      };

      /* 2. Redirect logo/peaks img src — use window.__resources (bundled blob URLs) with fallback */
      var srcDesc = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src');
      if (srcDesc && srcDesc.set) {
        Object.defineProperty(HTMLImageElement.prototype, 'src', {
          configurable: true, enumerable: true,
          get: srcDesc.get,
          set: function(v) {
            if (typeof v === 'string') {
              var r = window.__resources || {};
              if (v.indexOf('sparx-logo-ondark') !== -1)  v = r.logoOndark  || 'assets/sparx-logo-ondark.png';
              else if (v.indexOf('sparx-logo-onlight') !== -1) v = r.logoOnlight || 'assets/sparx-logo-onlight.png';
              else if (v.indexOf('hero-peaks') !== -1)     v = r.heroPeaks   || 'assets/hero-peaks.svg';
            }
            srcDesc.set.call(this, v);
          }
        });
      }
    })();
  </script>

  <!-- Patch SectorCard to resolve icon blob URLs after bundle loads -->
  <script>
    (function() {
      var ns = window.SPARXDesignSystem_59b6c5;
      var OrigSectorCard = ns.SectorCard;
      ns.SectorCard = function(props) {
        var icon = props.icon;
        if (icon) {
          var r = window.__resources || {};
          if (icon.indexOf('icon-biotech') !== -1)  icon = r.iconBiotech  || icon;
          else if (icon.indexOf('icon-retail') !== -1) icon = r.iconRetail   || icon;
        }
        var newProps = Object.assign({}, props, { icon: icon });
        return React.createElement(OrigSectorCard, newProps);
      };
    })();
  </script>
